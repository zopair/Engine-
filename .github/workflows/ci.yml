name: ENGINE CI

on:
  push:
    branches: [main, "phase-**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    name: Tests, licenses and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ENGINE_MODEL_PATH: ~/.cache/engine/models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
      ENGINE_THREADS: "2"
      ENGINE_MAX_CPU_THREADS: "2"
      ENGINE_MAX_MEMORY_MB: "12288"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Restore small GGUF model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/engine/models
          key: engine-models-${{ runner.os }}-${{ hashFiles('models/*.sha256') }}
          restore-keys: |
            engine-models-${{ runner.os }}-

      - name: Install minimal test tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q cli.py core memory agents tools

      - name: Run tests
        run: python -m pytest -q

      - name: License allowlist
        run: python scripts/check_licenses.py

      - name: Dependency vulnerability audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements-dev.txt
